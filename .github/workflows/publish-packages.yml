name: Publish ResourceGraph packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: NuGet package version to publish
        required: true
        default: 0.1.0-preview.1
        type: string
  push:
    tags:
      - resourcegraph-v*

concurrency:
  group: publish-resourcegraph-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: 10.0.401
  NUGET_SOURCE: https://nuget.pkg.github.com/lqdev/index.json

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Determine package version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$REQUESTED_VERSION"
          else
            version="${GITHUB_REF_NAME#resourcegraph-v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid NuGet version: $version" >&2
            exit 1
          fi

          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Restore solution
        run: dotnet restore ResourceGraph.sln

      - name: Build solution
        run: dotnet build ResourceGraph.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/ResourceGraph.Bootstrap.Tests/ResourceGraph.Bootstrap.Tests.csproj --configuration Release --no-build --no-restore

      - name: Pack approved reusable libraries
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          projects=(
            src/ResourceGraph.Core/ResourceGraph.Core.csproj
            src/ResourceGraph.AtProto/ResourceGraph.AtProto.csproj
            src/ResourceGraph.Syndication/ResourceGraph.Syndication.csproj
            src/ResourceGraph.Discovery/ResourceGraph.Discovery.csproj
            src/ResourceGraph.StandardSite/ResourceGraph.StandardSite.csproj
            src/ResourceGraph.Bluesky/ResourceGraph.Bluesky.csproj
            src/ResourceGraph.Composition/ResourceGraph.Composition.csproj
            src/ResourceGraph.Opml/ResourceGraph.Opml.csproj
            src/ResourceGraph.AppView/ResourceGraph.AppView.csproj
          )
          for project in "${projects[@]}"; do
            dotnet pack "$project" \
              --configuration Release \
              --no-build \
              --no-restore \
              --output artifacts/packages \
              -p:ResourceGraphVersion="$PACKAGE_VERSION"
          done

      - name: Publish packages
        env:
          NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" \
              --source "$NUGET_SOURCE" \
              --api-key "$NUGET_API_KEY"
          done
